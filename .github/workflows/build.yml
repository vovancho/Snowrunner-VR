name: Build dxgi.dll

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Apply patch
        shell: bash
        run: git apply --ignore-whitespace map_offcenter_v07.patch

      # Upstream CMakeLists.txt does not list these two sources, which causes
      # LNK2019/LNK1120 (game_addresses, xrinput::*). Add them to the target.
      - name: Add missing sources to CMakeLists.txt
        shell: bash
        run: |
          sed -i 's|^\(\s*\)src/hooks/pattern_scan.cpp\s*$|&\n\1src/hooks/game_addresses.cpp\n\1src/xr/xr_input.cpp|' CMakeLists.txt
          grep -n "game_addresses.cpp\|xr_input.cpp" CMakeLists.txt

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release

      - uses: actions/upload-artifact@v4
        with:
          name: dxgi
          path: |
            build/Release/dxgi.dll
            build/Release/dxgi.map
